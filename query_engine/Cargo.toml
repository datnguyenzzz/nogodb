[package]
name = "query_engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "query_engine"
path = "src/lib.rs"

[[bin]]
name = "nogodb_cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.11"
flatbuffers = "25.12.19"
log = "0.4.33"
paste = "1.0.15"
tokio = { version = "1.53.1", features = ["full"]}
